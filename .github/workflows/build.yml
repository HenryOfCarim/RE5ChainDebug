name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install i686 mingw-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Build ASI
        run: |
          make CXX=i686-w64-mingw32-g++ CXXFLAGS="-m32 -shared -O2 -Wall -static-libgcc -static-libstdc++"

      - name: Show artefact
        run: ls -l re5_chaindbg.asi

      - uses: actions/upload-artifact@v4
        with:
          name: re5_chaindbg-asi
          path: re5_chaindbg.asi
